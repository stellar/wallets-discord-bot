name: Build and push image

# Pushes to main run the tests, then build and push
# prd/wallets-discord-bot:<short sha>. ArgoCD Image Updater deploys new images
# in that repo to production automatically.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: build-and-push
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - run: yarn install --frozen-lockfile
      - run: yarn test:ci

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: ECR login
        id: ecr-login
        uses: stellar/actions/sdf-ecr-login@main

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.ecr-registry }}
        run: |
          set -eu
          TAG="${ECR_REGISTRY}/prd/wallets-discord-bot:$(git rev-parse --short HEAD)"
          export TAG
          make docker-build
          ecr-push "${TAG}"
